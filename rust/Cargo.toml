[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/lockvoid/replicaman"

[workspace.dependencies]
replicaman = { path = "crates/replicaman", version = "0.1.0" }
replicaman-loro = { path = "crates/replicaman-loro", version = "0.1.0" }
loro = "=1.13.7"
serde_json = "1.0"
tokio = "1.47"
uuid = { version = "1.18", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
